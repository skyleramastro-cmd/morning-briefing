name: Generate Morning Briefing

on:
  schedule:
    - cron: '30 10 * * *' # 6:30 AM EDT daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  run-briefing:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pillow pytz

      - name: Execute Briefing Generator
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python generate.py

      - name: Commit and Push New Audio & Feed
        run: |
          git config --global user.name 'Alfred-Bot'
          git config --global user.email 'alfred@mastro.local'
          git add briefing_today.mp3 cover_today.jpg podcast.xml
          git commit -m "Automated Morning Briefing $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
